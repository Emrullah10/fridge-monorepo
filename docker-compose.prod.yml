services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fridge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fridge_postgres_data:
