services:
  # KULLANILMIYOR (2026-08-16'dan beri). Proje artık makinedeki Homebrew
  # Postgres 15'i kullanıyor: postgres://fridge:fridge@localhost:5432/fridge
  # Bu servis referans/geri dönüş için duruyor; ayağa kaldırırsan .env'deki
  # DATABASE_URL portunu 55432'ye çevirmen gerekir.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fridge
      POSTGRES_PASSWORD: fridge
      POSTGRES_DB: fridge
    ports:
      - "55432:5432"
    volumes:
      - fridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fridge_postgres_data:
